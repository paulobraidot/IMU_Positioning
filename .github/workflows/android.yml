name: Android CI

on:
  push:
    branches: [ "jules", "master", "main" ]
  pull_request:
    branches: [ "jules", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/IMU_Positioning.apk

      - name: Upload IMU_Positioning.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMU_Positioning.apk
          path: build/artifacts/IMU_Positioning.apk
